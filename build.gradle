plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

// 用 BIN 分发，减少下载体积
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    // 只排除开发期文件：BlockBench 工程与 datagen 缓存
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = "Modmaven"
        url = uri("https://modmaven.dev/")
        content {
            includeGroup("org.appliedenergistics")
        }
    }
    maven {
        name = "Jared maven"
        url = uri("https://maven.blamejared.com")
        content {
            includeGroup("mezz.jei")
            includeGroup("net.mezzdev.config")
        }
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        name = "NeoForged"
        url = uri("https://maven.neoforged.net/releases")
        content {
            includeGroup("org.appliedenergistics")
        }
    }
}

base {
    archivesName = mod_id
}

// 1.21.1 的运行时是 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // 从哪些命名空间加载 GameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 界面两侧留给配方查看器的宽度；现场调：./gradlew runClient -Pgutter=64
            if (project.hasProperty('gutter')) {
                systemProperty 'ae2vf.gutter', project.property('gutter').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 跑数据层 GameTest；没有用例时服务器会直接崩，属于预期
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // 产物写进 src/generated/resources，已有资源从 src/main/resources 读
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Applied Energistics 2（1.21.1 线）。Modmaven 的 19.2.20 目录还是空的，
    // 改从 Modrinth 的 maven 取同版本 jar。
    implementation("maven.modrinth:ae2:${ae2_version}")

    // JEI：可选依赖，编译期 + 开发运行期
    compileOnly("mezz.jei:jei-1.21.1-neoforge:${jei_version}")
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:${jei_version}")

    // Mekanism：只用于本地运行期测试流体机器，不做编译依赖
    localRuntime("maven.modrinth:mekanism:${mekanism_version}")

    // EMI：本地运行期测试用；编译期只用它的 API 给工厂菜单注册配方转移。
    compileOnly("maven.modrinth:emi:${emi_version}")
    localRuntime("maven.modrinth:emi:${emi_version}")

    // Applied Flux：可选 FE 存储附属，编译期依赖 + 默认本地运行期。
    // 加 -PwithoutAppFlux 可从运行期移除，用来验证「没装附属也能启动」。
    compileOnly("maven.modrinth:appflux:${appflux_version}")
    if (!project.hasProperty("withoutAppFlux")) {
        localRuntime("maven.modrinth:appflux:${appflux_version}")
        localRuntime("maven.modrinth:glodium:${glodium_version}")
    }

    // 测试环境专用：只进 localRuntime，不参与编译、不发布。
    // 放这里后 runClient 由 ModDevGradle 注入，重建 run/ 也不会丢；
    // 不要手动往 run/mods 放 jar。
    localRuntime("maven.modrinth:justenoughcharacters:${jecharacters_version}")
    localRuntime("maven.modrinth:mouse-tweaks:${mousetweaks_version}")
    // AE2 / JEI 的运行时前置：GuideME 与 mezz_config 不在 mod jar 里。
    localRuntime("org.appliedenergistics:guideme:${guideme_version}")
    localRuntime("net.mezzdev.config:mezz_config-1.21.1-neoforge:${mezzconfig_version}")

    // AE2WTLib 提供 ExtendedAE 必需的 ae2wtlib_api。
    localRuntime("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")
    localRuntime("maven.modrinth:extended-ae:${extendedae_version}")
    localRuntime("maven.modrinth:extendedae-plus:${extendedae_plus_version}")

    // 依赖写法模板：拉同仓库的兄弟工程，或改成 files("libs/xxx.jar") 直接引用本地 jar
    // implementation project(":myproject")
}

// 把 gradle.properties 里的属性写进 neoforge.mods.toml；少声明一个属性会直接报错
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// 展开后的元数据同时给命令行构建与 IDE 用
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 本地 maven 仓库发布，产物落在 repo/，只给开发期用
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ---------------------------------------------------------------------------
// 发布到 CurseForge
//
// 凭据走环境变量，项目 id 走 -P 参数（id 不是密钥，但不写死在仓库里）。
// 缺凭据时任务会给出明确报错，不影响 ./gradlew build。
// ---------------------------------------------------------------------------

def releaseChannel = providers.gradleProperty('release_channel').orElse('beta').get()
def curseforgeProjectId = providers.gradleProperty('curseforge_project_id').orNull
def curseforgeToken = System.getenv('CURSEFORGE_TOKEN')

// 发布说明取 CHANGELOG.md 里当前版本标题下的条目，避免手抄两份。
def versionChangelog = {
    def changelog = rootProject.file('CHANGELOG.md')
    def fallback = '本次更新见仓库 CHANGELOG.md。'
    if (!changelog.exists()) {
        return fallback
    }
    def lines = changelog.readLines('UTF-8')
    def start = lines.findIndexOf { it.trim() == "# ${mod_version}" }
    if (start < 0) {
        return fallback
    }
    def body = []
    for (int i = start + 1; i < lines.size(); i++) {
        if (lines[i].startsWith('# ')) {
            break
        }
        body << lines[i]
    }
    def text = body.join('\n').trim()
    return text.isEmpty() ? fallback : text
}

// CurseForge 官方插件（net.darkhax.curseforgegradle 1.3.x）要求 JVM 25，
// 而本项目必须用 Java 21 构建，因此这里直接用 JDK 自带的 HttpClient 调
// legacy upload API，不引入额外依赖，也不受 Gradle 大版本影响。
tasks.register('publishCurseForge') {
    group = 'publishing'
    description = '上传 build/libs 里的 jar 到 CurseForge；需要 CURSEFORGE_TOKEN 与 -Pcurseforge_project_id。'
    dependsOn tasks.named('jar')
    notCompatibleWithConfigurationCache('上传任务里有 HTTP 调用与临时文件拼装，不做配置缓存。')
    doLast {
        def token = System.getenv('CURSEFORGE_TOKEN')
        if (!token) {
            throw new GradleException('缺少环境变量 CURSEFORGE_TOKEN。')
        }
        if (!curseforgeProjectId) {
            throw new GradleException('缺少项目 id：用 -Pcurseforge_project_id=<数字 id> 传入。')
        }

        def jarFile = tasks.jar.archiveFile.get().asFile
        def metadata = groovy.json.JsonOutput.toJson([
                changelog    : versionChangelog(),
                changelogType: 'markdown',
                displayName  : "${mod_name} ${mod_version}",
                releaseType  : releaseChannel,
                gameVersions : [minecraft_version],
                modLoaders   : ['neoforge'],
                // relations 用 CurseForge 的项目 slug（和项目页地址一致）：
                // AE2 在 CF 叫 applied-energistics-2，Applied Flux 叫 applied-flux，写成 ae2 / appflux 会解析失败。
                relations    : [
                        projects: [
                                [slug: 'applied-energistics-2', type: 'requiredDependency'],
                                [slug: 'applied-flux', type: 'optionalDependency'],
                                [slug: 'jei', type: 'optionalDependency'],
                        ],
                ],
        ])

        def boundary = '----ae2vf' + UUID.randomUUID().toString().replace('-', '')
        def body = new ByteArrayOutputStream()
        body.write(("--${boundary}\r\n" +
                "Content-Disposition: form-data; name=\"metadata\"\r\n\r\n" +
                metadata + "\r\n").getBytes('UTF-8'))
        body.write(("--${boundary}\r\n" +
                "Content-Disposition: form-data; name=\"file\"; filename=\"${jarFile.name}\"\r\n" +
                "Content-Type: application/java-archive\r\n\r\n").getBytes('UTF-8'))
        body.write(jarFile.bytes)
        body.write(("\r\n--${boundary}--\r\n").getBytes('UTF-8'))

        def request = java.net.http.HttpRequest.newBuilder()
                .uri(URI.create("https://minecraft.curseforge.com/api/projects/${curseforgeProjectId}/upload"))
                .header('X-Api-Token', token)
                .header('Content-Type', "multipart/form-data; boundary=${boundary}")
                .POST(java.net.http.HttpRequest.BodyPublishers.ofByteArray(body.toByteArray()))
                .build()

        def response = java.net.http.HttpClient.newBuilder().build()
                .send(request, java.net.http.HttpResponse.BodyHandlers.ofString())
        if (response.statusCode() != 200) {
            def location = response.headers().firstValue('location').orElse('')
            def hint = response.statusCode() == 302 ? '（302 一般是项目 id 或 token 不对，也可能是项目还没审核通过）' : ''
            throw new GradleException("CurseForge 上传失败：HTTP ${response.statusCode()} ${location}${hint}\n${response.body()}")
        }
        logger.lifecycle("CurseForge 上传成功：${response.body()}")
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

# 构建配置：只保留本模组实际用到的项，其余交给 GTNHGradle 默认值。

# Spotless 共享格式配置版本（Blowdryer）。
gtnh.settings.blowdryerTag = 0.2.2

# 模组身份：写入 mcmod.info。
modName = AE2 Void Factory
modId = ae2vf
modGroup = io.github.crafteve.ae2vf

# 目标游戏版本与映射。
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# 允许现代语法，产物仍是 Java 8 字节码。
enableModernJavaSyntax = jabel

# 生成 io.github.crafteve.ae2vf.Tags，供 @Mod 读取版本号。
generateGradleTokenClass = io.github.crafteve.ae2vf.Tags
gradleTokenVersion = VERSION

# 本模组不用 Mixin、不发布 Maven、不自动改写构建脚本。
usesMixins = false
usesMavenPublishing = false
autoUpdateBuildScript = false

# 开发环境默认玩家名。
developmentEnvironmentUserName = Developer

# 构建加速。
org.gradle.configuration-cache = true
org.gradle.parallel = true

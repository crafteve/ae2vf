name: Release

# 推 v 开头的 tag 触发：构建、发 GitHub Release，配了 CURSEFORGE_TOKEN 时再上传到 CurseForge。
# 没有配任何凭据也能跑通，只是少了 CurseForge 那一步。
#   Secrets：CURSEFORGE_TOKEN（可选）
#   Variables：CURSEFORGE_PROJECT_ID（可选，与 token 一起用）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 tag 与 mod_version 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$tag" != "$version" ]; then
            echo "tag 是 $tag，但 gradle.properties 的 mod_version 是 $version"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --console=plain

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ae2vf-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      - name: 上传到 CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          if [ -z "${CURSEFORGE_PROJECT_ID}" ]; then
            echo "有 token 但没有 CURSEFORGE_PROJECT_ID，跳过上传。"
            exit 0
          fi
          ./gradlew publishCurseForge -Pcurseforge_project_id="${CURSEFORGE_PROJECT_ID}" --console=plain

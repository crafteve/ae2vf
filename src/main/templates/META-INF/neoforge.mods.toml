# AE2 虚空工厂 —— 运行期元数据
# 只保留实际生效的字段。花括号占位符由 build.gradle 的 generateModMetadata 展开，改注释时不要动它们。

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 玩家反馈入口，显示在模组列表的 tooltip 里
issueTrackerURL="https://github.com/crafteve/ae2vf/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="crafteve"
displayURL="https://github.com/crafteve/ae2vf"
# jar 根目录下的图标，显示在模组列表与详情页
logoFile="ae2vf_logo.png"
description='''
AE2 Void Factory: bind machines with a wand, configure IO rules in a terminal, and let the ME network handle the rest.
'''

# 必需：NeoForge 版本下限
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# 必需：只支持 1.21.1
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 必需：AE2 附属，没有 AE2 不启动
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2.10,)"
    ordering="NONE"
    side="BOTH"

# 可选：装了 JEI 才能在配方里定位节点、拖拽资源建规则
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"
